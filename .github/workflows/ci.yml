name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.config }} / ${{ matrix.dc }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: lua51
            apt: liblua5.1-0-dev
            dc: ldc-latest
          - config: lua52
            apt: liblua5.2-dev
            dc: ldc-latest
          - config: lua53
            apt: liblua5.3-dev
            dc: ldc-latest
          - config: lua54
            apt: liblua5.4-dev
            dc: ldc-latest
          - config: lua54
            apt: liblua5.4-dev
            dc: dmd-latest
          - config: luajit
            apt: libluajit-5.1-dev
            dc: ldc-latest
          # Lua 5.5 is covered by the runtime-scripts job below because
          # distro packages may lag behind the upstream release.
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
      - name: Build
        run: dub build --config=${{ matrix.config }} --compiler=${{ matrix.dc == 'dmd-latest' && 'dmd' || 'ldc2' }}
      - name: Test
        run: dub test --config=${{ matrix.config }} --compiler=${{ matrix.dc == 'dmd-latest' && 'dmd' || 'ldc2' }}

  runtime-scripts:
    name: runtime scripts / ${{ matrix.dc }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dc:
          - ldc-latest
          - dmd-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}
      - uses: actions/cache@v4
        with:
          path: .lua/linux
          key: ${{ runner.os }}-lua-${{ hashFiles('tools/test-lua.sh') }}
      - name: Build and test all profiles from source
        run: ./tools/test-lua.sh --compiler=${{ matrix.dc == 'dmd-latest' && 'dmd' || 'ldc2' }}

  windows:
    name: windows / ${{ matrix.dc }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dc:
          - ldc-latest
          - dmd-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}
      - uses: actions/cache@v4
        with:
          path: .lua
          key: ${{ runner.os }}-lua-${{ hashFiles('tools/test-lua.ps1') }}
      - name: Build and test all profiles
        shell: pwsh
        run: ./tools/test-lua.ps1 -Compiler ${{ matrix.dc == 'dmd-latest' && 'dmd' || 'ldc2' }}

  macos:
    name: macos / ${{ matrix.config }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: lua54
            formula: lua@5.4
          - config: lua55
            formula: lua
          - config: luajit
            formula: luajit
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - name: Install Lua
        run: brew install ${{ matrix.formula }}
      - name: Build and test
        shell: bash
        run: |
          prefix="$(brew --prefix ${{ matrix.formula }})"
          export LDFLAGS="-L$prefix/lib ${LDFLAGS:-}"
          export LIBRARY_PATH="$prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$prefix/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          dub build --config=${{ matrix.config }} --compiler=ldc2
          dub test --config=${{ matrix.config }} --compiler=ldc2
