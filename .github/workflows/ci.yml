name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.config }} / ${{ matrix.dc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: lua51
            apt: liblua5.1-0-dev
            dc: ldc-latest
          - config: lua52
            apt: liblua5.2-dev
            dc: ldc-latest
          - config: lua53
            apt: liblua5.3-dev
            dc: ldc-latest
          - config: lua54
            apt: liblua5.4-dev
            dc: ldc-latest
          - config: lua54
            apt: liblua5.4-dev
            dc: dmd-latest
          - config: luajit
            apt: libluajit-5.1-dev
            dc: ldc-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ${{ matrix.dc }}
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
      - name: Build
        run: dub build --config=${{ matrix.config }} --compiler=${{ matrix.dc == 'dmd-latest' && 'dmd' || 'ldc2' }}
      - name: Test
        run: dub test --config=${{ matrix.config }} --compiler=${{ matrix.dc == 'dmd-latest' && 'dmd' || 'ldc2' }}

  runtime-scripts:
    name: runtime scripts / ${{ matrix.dc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dc:
          - ldc-latest
          - dmd-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ${{ matrix.dc }}
      - name: Build and test all profiles from source
        run: ./tools/test-lua.sh --compiler=${{ matrix.dc == 'dmd-latest' && 'dmd' || 'ldc2' }}
